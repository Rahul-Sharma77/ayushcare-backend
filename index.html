<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--g1:#047857;--g2:#059669;--g3:#10b981;--g4:#d1fae5;--g5:#f0fdf4;--saf:#f59e0b;--red:#dc2626;--red2:#ef4444;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--card:#ffffff;--shadow:0 6px 20px rgba(4,120,87,.08);--shadow2:0 15px 40px rgba(4,120,87,.15);}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;color:var(--ink);background:linear-gradient(135deg,#f8fafc 0%,#f0fdf4 50%,#ecfdf5 100%);min-height:100vh;background-attachment:fixed;overflow-x:hidden;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:16px;outline:none}
button{cursor:pointer;border:none;background:none;transition:.2s ease}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--g3);border-radius:10px}
.wrap{max-width:540px;margin:0 auto;padding:16px;padding-bottom:100px}
.wrap-lg{max-width:900px;margin:0 auto;padding:20px;padding-bottom:100px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.row{display:flex;align-items:center}.between{display:flex;align-items:center;justify-content:space-between}
.gap8{gap:8px}.gap12{gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.tc{text-align:center}.bold{font-weight:700}.semi{font-weight:600}
.muted{color:var(--muted)}.green{color:var(--g1)}.red{color:var(--red)}
.t-xs{font-size:12px}.t-sm{font-size:14px}.t-lg{font-size:19px}.t-xl{font-size:24px}.t-2xl{font-size:30px}.t-3xl{font-size:38px}
.hdr{background:#fff;color:var(--g1);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.04);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line)}
.hdr h1{font-size:19px;font-weight:800;letter-spacing:-.4px}
.hdr-btn{background:var(--g5);color:var(--g1);padding:8px 14px;border-radius:22px;font-size:13px;font-weight:700;border:1px solid var(--g4)}
.hdr-btn:active{transform:scale(.94);background:var(--g4)}
.hdr-btn.dark{background:var(--g1);color:#fff;border-color:var(--g1)}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px;animation:rise .35s ease;border:1px solid #f1f5f9}
.card-hero{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 50%,#0d9488 100%);color:#fff;border-radius:24px;padding:24px;box-shadow:var(--shadow2);position:relative;overflow:hidden}
.card-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:rgba(255,255,255,.1);border-radius:50%}
.card-hero::after{content:'';position:absolute;right:-8px;bottom:-20px;font-size:100px;opacity:.12}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px;border-radius:16px;font-size:17px;font-weight:700;transition:.2s;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 20px rgba(4,120,87,.28)}
.btn:active{transform:scale(.97)}
.btn-o{background:#fff;color:var(--g1);border:2px solid var(--g2);box-shadow:var(--shadow)}
.btn-red{background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 8px 20px rgba(220,38,38,.28)}
.btn-saf{background:linear-gradient(135deg,#f59e0b,#f97316);box-shadow:0 8px 20px rgba(245,158,11,.28)}
.btn-wa{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 8px 20px rgba(34,197,94,.28)}
.btn-blue{background:linear-gradient(135deg,#2563eb,#3b82f6);box-shadow:0 8px 20px rgba(37,99,235,.28)}
.btn-gray{background:#64748b;box-shadow:none}
.btn-sm{padding:11px 16px;font-size:14px;border-radius:12px;width:auto}
.lbl{display:block;font-size:15px;font-weight:700;margin-bottom:8px;color:var(--ink)}
.inp{width:100%;padding:15px;border:2px solid var(--line);border-radius:14px;background:#f8fafc;transition:.2s;font-size:16px}
.inp:focus{border-color:var(--g3);background:#fff;box-shadow:0 0 0 4px var(--g5)}
.inp-row{display:flex;gap:10px;align-items:stretch}.inp-row .inp{flex:1}
textarea.inp{resize:vertical;min-height:88px}
.mic{width:54px;min-width:54px;border-radius:14px;font-size:22px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 15px rgba(4,120,87,.3);transition:.2s}
.mic:active{transform:scale(.92)}
.mic.on{background:linear-gradient(135deg,#dc2626,#ef4444);animation:mpulse 1s infinite}
@keyframes mpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(220,38,38,.6)}50%{transform:scale(1.1);box-shadow:0 0 0 14px rgba(220,38,38,0)}}
.spk{background:var(--g4);color:var(--g1);width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:420px}
.lang-card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:22px 10px;text-align:center;box-shadow:var(--shadow);transition:.2s}
.lang-card:active{transform:scale(.94);border-color:var(--g2);background:var(--g5)}
.lang-card .fl{font-size:36px;display:block;margin-bottom:6px;color:var(--g1);font-weight:800;line-height:1}
.lang-card .nm{font-size:17px;font-weight:700;color:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border-radius:18px;padding:18px 10px;text-align:center;box-shadow:var(--shadow);transition:.2s;border:1px solid #f1f5f9;position:relative}
.tile:active{transform:scale(.95);background:var(--g5)}
.tile .ic{font-size:32px;display:block;margin-bottom:8px}
.tile .tx{font-size:13px;font-weight:700;color:#334155;line-height:1.3}
.tile .badge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:800}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:10px 16px;border-radius:24px;background:#fff;border:2px solid var(--line);font-size:13px;font-weight:700;color:#475569;flex-shrink:0}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:var(--g1);box-shadow:0 5px 14px rgba(4,120,87,.3)}
.sym-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:360px;overflow-y:auto;padding:4px}
.sym{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 5px;text-align:center;transition:.2s;position:relative}
.sym:active{transform:scale(.93)}
.sym.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:var(--g1);color:#fff;box-shadow:0 6px 16px rgba(4,120,87,.35);transform:translateY(-2px)}
.sym .ic{font-size:26px;display:block;margin-bottom:4px}
.sym .nm{font-size:11px;font-weight:700;line-height:1.25}
.sym .flag{position:absolute;top:3px;right:5px;font-size:11px}
.opts{display:grid;gap:9px}
.opts.c2{grid-template-columns:1fr 1fr}.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{padding:13px 8px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:14px;font-weight:700;color:#475569;text-align:center;transition:.2s}
.opt:active{transform:scale(.95)}
.opt.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:var(--g1);box-shadow:0 5px 14px rgba(4,120,87,.3)}
.opt.on.sev-h{background:linear-gradient(135deg,#dc2626,#ef4444);border-color:#dc2626}
.opt.on.sev-m{background:linear-gradient(135deg,#f59e0b,#f97316);border-color:#f59e0b}
.chk{display:flex;align-items:center;gap:10px;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.chk.on{border-color:var(--g2);background:var(--g5)}
.chk input{width:20px;height:20px;accent-color:var(--g1)}
.prog-wrap{background:#fff;border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid #f1f5f9}
.prog-bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-top:9px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--g1),var(--g3));border-radius:10px;transition:width .5s ease}
.steps{display:flex;justify-content:space-between;margin-top:10px}
.step{width:26px;height:26px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.step.done{background:var(--g2);color:#fff}
.step.now{background:var(--g1);color:#fff;box-shadow:0 0 0 4px var(--g5)}
.chat{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 200px);overflow-y:auto;padding-bottom:100px}
.bub{max-width:82%;padding:14px 16px;border-radius:20px;font-size:15px;line-height:1.5;box-shadow:0 2px 10px rgba(0,0,0,.05);animation:rise .3s}
.bub.ai{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;border:1px solid var(--line)}
.bub.me{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.bub.warn{background:linear-gradient(135deg,#fef3c7,#fed7aa);border:2px solid var(--saf)}
.chat-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;display:flex;gap:8px;box-shadow:0 -4px 20px rgba(0,0,0,.08);max-width:540px;margin:0 auto;border-top:1px solid var(--line)}
.quick{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}

.alert{padding:14px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.5;display:flex;gap:10px}
.alert-red{background:#fef2f2;border:2px solid #fecaca;color:#991b1b}
.alert-warn{background:#fffbeb;border:2px solid #fcd34d;color:#92400e}
.alert-ok{background:var(--g5);border:2px solid var(--g4);color:var(--g1)}
.alert-blue{background:#eff6ff;border:2px solid #bfdbfe;color:#1e40af}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:92%;max-width:420px}
.toast{background:var(--ink);color:#fff;padding:14px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:drop .3s;line-height:1.4}
.toast.ok{background:linear-gradient(135deg,var(--g1),var(--g2))}
.toast.err{background:linear-gradient(135deg,#dc2626,#ef4444)}
.toast.warn{background:linear-gradient(135deg,#f59e0b,#f97316)}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
#loader{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:9998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;backdrop-filter:blur(4px)}
.spin{width:52px;height:52px;border:5px solid var(--g4);border-top-color:var(--g1);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.rv:last-child{border:none}
.rv .k{font-size:13px;color:var(--muted);font-weight:600;min-width:100px}
.rv .v{font-size:14px;font-weight:700;text-align:right;flex:1;word-break:break-word}
.rep-card{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border-left:5px solid var(--g2)}
.rep-card.sev{border-left-color:var(--red)}
.rep-card.reviewed{border-left-color:#2563eb;background:linear-gradient(135deg,#f8fafc,#eff6ff)}
.pill{display:inline-block;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:800}
.pill-g{background:var(--g4);color:var(--g1)}
.pill-y{background:#fef3c7;color:#92400e}
.pill-r{background:#fee2e2;color:#991b1b}
.pill-b{background:#dbeafe;color:#1e40af}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -4px 20px rgba(0,0,0,.06);max-width:540px;margin:0 auto;z-index:40;padding:10px 0 12px;border-radius:22px 22px 0 0;border-top:1px solid var(--line)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#94a3b8;padding:5px}
.bnav button.on{color:var(--g1)}
.bnav .bi{font-size:22px}
.qr-box{background:#fff;padding:16px;border-radius:18px;display:inline-block;box-shadow:var(--shadow2);border:3px solid var(--g4)}
.qr-box img{display:block;image-rendering:pixelated}
.bodymap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bp{padding:11px 5px;border:2px solid var(--line);border-radius:13px;background:#fff;font-size:12px;font-weight:700;text-align:center;transition:.2s}
.bp.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:var(--g1)}
.review-badge{display:inline-flex;align-items:center;gap:6px;background:#dbeafe;color:#1e40af;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:800;margin-left:8px}
.action-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.doc-img{width:100%;border-radius:12px;max-height:220px;object-fit:cover;display:block}
</style>

function t(k){return (T[lang]&&T[lang][k])||T.en[k]||k;}
function sname(s){return lang==='hi'?s.hi:(s[lang]||s.en);}
function bname(b){return lang==='hi'?b.hi:(b[lang]||b.en);}
function cname(c){return lang==='hi'?c.hi:(c[lang]||c.en);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function normPhone(p){return String(p||'').replace(/\D/g,'');}
function toast(msg,type){
  const c=document.getElementById('toasts');const d=document.createElement('div');
  d.className='toast '+(type||'');d.innerHTML=msg;c.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transform='translateY(-14px)';setTimeout(()=>d.remove(),300);},3500);
}
function load(on){document.getElementById('loader').style.display=on?'flex':'none';}

function pick(btn,key,val){[...btn.parentElement.children].forEach(b=>b.classList.remove('on'));btn.classList.add('on');F[key]=val;}

/* ═══════════ VOICE ═══════════ */
let recog=null;
async function mic(inputId,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast(' Use Chrome browser','err');return;}
  if(location.protocol==='file:'){toast(' Upload to Netlify for mic','warn');return;}
  try{if(navigator.mediaDevices){const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(x=>x.stop());}}
  catch(e){toast(' Allow mic access','err');return;}
  if(recog){try{recog.stop();}catch(e){}}
  recog=new SR();recog.lang=LC[lang]||'en-IN';recog.interimResults=false;recog.continuous=false;
  btn.classList.add('on');btn.textContent='';
  const reset=()=>{btn.classList.remove('on');btn.textContent='';};
  recog.onresult=e=>{const txt=e.results[0][0].transcript;const el=document.getElementById(inputId);if(el){el.value=(el.value?el.value+' ':'')+txt;}toast(' '+txt,'ok');};
  recog.onerror=e=>{reset();if(e.error!=='aborted')toast('Voice error: '+e.error,'err');};
  recog.onend=reset;
  try{recog.start();}catch(err){reset();toast('Mic busy','err');}
}
function speak(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=LC[lang]||'en-IN';u.rate=.92;speechSynthesis.speak(u);}catch(e){}}
function micBtn(id){return `<button class="mic" onclick="mic('${id}',this)"></button>`;}

/* ═══════════ SAFE FETCH (60s for Render cold start) ═══════════ */
async function safeFetch(url,options,timeoutMs){
  timeoutMs=timeoutMs||60000;
  if(!API_URL)return null;
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
    const res=await fetch(url,Object.assign({},options||{},{signal:ctrl.signal}));
    clearTimeout(timer);
    const data=await res.json().catch(()=>null);
    if(!res.ok)return null;
    return data;
  }catch(e){console.log('Fetch failed:',e.message);return null;}
}

/* ═══════════ LOCAL STORAGE HELPERS ═══════════ */
function getInbox(){return JSON.parse(localStorage.getItem('ac_inbox')||'[]');}
function setInbox(arr){localStorage.setItem('ac_inbox',JSON.stringify(arr));}
function upsertLocalReport(updated){
  let inbox=getInbox();
  const i=inbox.findIndex(r=>r.reportId===updated.reportId);
  if(i>=0)inbox[i]={...inbox[i],...updated};
  else inbox.unshift(updated);
  setInbox(inbox);
  const phone=normPhone(updated.patientPhone);
  if(!phone)return;
  const key='ac_rep_'+phone;
  let arr=JSON.parse(localStorage.getItem(key)||'[]');
  const j=arr.findIndex(r=>r.reportId===updated.reportId);
  if(j>=0)arr[j]={...arr[j],...updated};
  else arr.unshift(updated);
  localStorage.setItem(key,JSON.stringify(arr));
}

  const ph=normPhone(document.getElementById('lp').value);

  const local=JSON.parse(localStorage.getItem('ac_me')||'null');
  if(local&&local.phone===ph){me=local;toast(' '+t('hi')+' '+local.name,'ok');go(PageHome);return;}
  load(1);

  if(d&&d.patient){me=d.patient;localStorage.setItem('ac_me',JSON.stringify(d.patient));go(PageHome);}

}

  let list=SYM.filter(s=>activeCat==='all'||s.c===activeCat);
  if(symQuery)list=SYM.filter(s=>(s.en+s.hi).toLowerCase().includes(symQuery));
  const sel=F.symptoms||[];
  document.getElementById('symg').innerHTML=list.map(s=>{const n=sname(s);const on=sel.includes(n)?'on':'';
    return `<button class="sym ${on}" onclick="toggleSym('${n.replace(/'/g,"\\'")}',${s.red?1:0})">${s.red?'<span class="flag"></span>':''}<span class="ic">${s.i}</span><span class="nm">${n}</span></button>`;
  }).join('')||`<div class="muted tc" style="grid-column:1/-1;padding:20px"> No match</div>`;
}
function toggleSym(n,red){
  F.symptoms=F.symptoms||[];
  const i=F.symptoms.indexOf(n);
  if(i>-1)F.symptoms.splice(i,1);else F.symptoms.push(n);
  if(red&&i===-1){F.redFlag=true;document.getElementById('redwarn').innerHTML=`<div class="alert alert-red"> <div><b>Serious symptom!</b> Call 108<br><a href="tel:108" class="btn btn-red btn-sm mt8" style="display:inline-flex"> 108</a></div></div>`;}
  drawSyms();
}

async function submitReport(){
  if(!document.getElementById('cf').checked){toast(' '+t('confirm'),'warn');return;}
  const rep={reportId:'AYU-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6),
    patientPhone:normPhone(me.phone),patientName:me.name,patientAge:me.age||0,patientGender:me.gender||'Other',
    mainComplaint:F.mainComplaint,duration:F.duration,severity:F.severity,
    problemDetails:F.problemDetails||'-',location:F.location||'-',
    worseBy:F.worseBy||'-',betterBy:F.betterBy||'-',otherSymptoms:F.otherSymptoms||'-',
    existingConditions:F.existingConditions||t('none'),allergies:F.allergies||t('none'),
    currentMedicines:F.currentMedicines||t('none'),familyHistory:F.familyHistory||t('none'),
    appetite:F.appetite||'-',digestion:F.digestion||'-',sleep:F.sleep||'-',
    stress:F.stress||'-',exercise:F.exercise||'-',habits:F.habits||t('none'),
    extraNotes:F.extraNotes||'-',redFlag:F.redFlag?'YES':'NO',
    status:'pending',doctorNotes:'',doctorPrescription:'',reviewedAt:null,viewCount:0,
    createdAt:new Date().toISOString()};
  load(1);
  upsertLocalReport(rep);
  const apiRes=await safeFetch(API_URL+'/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rep)},60000);
  load(0);
  if(apiRes&&apiRes.success)toast(' Saved to cloud database','ok');
  else toast(' Saved locally. Server sync pending','warn');
  lastReport=rep;go(PageDone);
}

/* ═══════════ PDF ═══════════ */
function dlPDF(){
  if(!lastReport){toast(' No report','err');return;}
  const r=lastReport;
  try{
    if(window.jspdf&&window.jspdf.jsPDF){
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF('p','mm','a4');
      const pageW=210;const margin=14;const maxW=pageW-margin*2;let y=16;
      const ensureSpace=(need)=>{if(y+need>287){doc.addPage();y=16;}};
      const addTitle=(text)=>{ensureSpace(12);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(4,120,87);doc.text(String(text),margin,y);y+=8;doc.setDrawColor(4,120,87);doc.setLineWidth(0.6);doc.line(margin,y,pageW-margin,y);y+=8;doc.setTextColor(15,23,42);};
      const addHeading=(text)=>{ensureSpace(10);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(4,120,87);doc.text(String(text),margin,y);y+=6;doc.setDrawColor(226,232,240);doc.setLineWidth(0.3);doc.line(margin,y,pageW-margin,y);y+=5;doc.setTextColor(15,23,42);};
      const addLine=(label,value,boldValue)=>{const labelText=String(label||'');const valueText=String(value==null||value===''?'-':value);doc.setFont('helvetica','bold');doc.setFontSize(10);const labelWidth=48;const valueLines=doc.splitTextToSize(valueText,maxW-labelWidth);ensureSpace(valueLines.length*5+3);doc.text(labelText,margin,y);doc.setFont('helvetica',boldValue?'bold':'normal');doc.text(valueLines,margin+labelWidth,y);y+=valueLines.length*5+2;};
      const addPara=(text,italic)=>{doc.setFont('helvetica',italic?'italic':'normal');doc.setFontSize(10);const lines=doc.splitTextToSize(String(text||'-'),maxW);ensureSpace(lines.length*5+3);doc.text(lines,margin,y);y+=lines.length*5+3;};
      
      addTitle('AyushCare Clinical Case Report');
      addLine('Report ID:',r.reportId||'-');
      addLine('Date:',new Date(r.createdAt||Date.now()).toLocaleString());
      y+=2;
      addHeading('1. PATIENT DETAILS');
      addLine('Name:',r.patientName||'-',true);
      addLine('Age / Gender:',(r.patientAge||'-')+' / '+(r.patientGender||'-'));
      addLine('Mobile:',r.patientPhone||'-');
      y+=2;
      if(r.redFlag==='YES'){
        ensureSpace(12);
        doc.setFillColor(254,242,242);doc.setDrawColor(220,38,38);
        doc.roundedRect(margin,y-4,maxW,10,2,2,'FD');
        doc.setTextColor(153,27,27);doc.setFont('helvetica','bold');doc.setFontSize(10);
        doc.text('URGENT: Red-flag symptom reported',margin+3,y+3);
        doc.setTextColor(15,23,42);y+=12;
      }
      addHeading('2. CHIEF COMPLAINT');
      addLine('Main Problem:',r.mainComplaint||'-',true);
      addLine('Location:',r.location||'-');
      addLine('Duration:',r.duration||'-');
      addLine('Severity:',r.severity||'-',true);
      addLine('Patient says:',r.problemDetails||'-');
      y+=2;
      addHeading('3. AGGRAVATING / RELIEVING');
      addLine('Worse by:',r.worseBy||'-');
      addLine('Better by:',r.betterBy||'-');
      addLine('Other symptoms:',r.otherSymptoms||'-');
      y+=2;
      addHeading('4. MEDICAL HISTORY');
      addLine('Existing conditions:',r.existingConditions||'-');
      addLine('Allergies:',r.allergies||'-');
      addLine('Current medicines:',r.currentMedicines||'-');
      addLine('Family history:',r.familyHistory||'-');
      y+=2;
      addHeading('5. LIFESTYLE');
      addLine('Appetite:',r.appetite||'-');
      addLine('Digestion:',r.digestion||'-');
      addLine('Sleep:',r.sleep||'-');
      addLine('Stress:',r.stress||'-');
      addLine('Exercise:',r.exercise||'-');
      addLine('Habits:',r.habits||'-');
      y+=2;
      addHeading('6. PATIENT NOTES');
      addPara(r.extraNotes||'-',true);
      y+=2;
      if(r.status==='reviewed'){
        addHeading('7. DOCTOR REVIEW');
        addLine('Status:','Reviewed',true);
        addLine('Reviewed by:',r.reviewedBy||'Doctor');
        addLine('Reviewed at:',r.reviewedAt?new Date(r.reviewedAt).toLocaleString():'-');
        addLine('Clinical notes:',r.doctorNotes||'-');
        addLine('Prescription (Rx):',r.doctorPrescription||'-');
      }else{
        addHeading('7. FOR DOCTOR USE ONLY');
        addPara('Nadi / Jihva / Prakriti / Diagnosis / Treatment:');
        ensureSpace(28);
        doc.setDrawColor(100,116,139);
        doc.roundedRect(margin,y,maxW,28,2,2);
        y+=34;
        doc.setFont('helvetica','normal');doc.setFontSize(10);
        doc.line(pageW-margin-60,y,pageW-margin,y);
        doc.text("Doctor's Signature",pageW-margin-60,y+5);
        y+=12;
      }
      ensureSpace(16);
      doc.setDrawColor(226,232,240);doc.line(margin,y,pageW-margin,y);y+=6;
      doc.setFontSize(8);doc.setTextColor(100,116,139);
      const footer=doc.splitTextToSize('AyushCare • Ministry of AYUSH • SIH26047',maxW);
      doc.text(footer,margin,y);
      doc.save('AyushCare_'+(r.reportId||'Report')+'.pdf');
      toast(' PDF Downloaded','ok');
      return;
    }
  }catch(err){console.error(err);}
  toast(' PDF failed','err');
}

/* Hard client-side safety net — checked BEFORE calling Gemini.
   Emergencies always get the same instant, reliable reply; never left to the model. */
function emergencyCheck(m){
  const H=lang==='hi';const has=(...w)=>w.some(x=>m.includes(x));
  if(has('chest pain','सीने में दर्द','can\'t breathe','breathless','सांस नहीं','unconscious','बेहोश','severe bleeding','ज्यादा खून','suicide','आत्महत्या','poison','जहर'))
    return H?' यह आपातकाल हो सकता है। कृपया तुरंत <b>108</b> पर कॉल करें या नज़दीकी अस्पताल जाएं।':' This could be a medical emergency. Please call <b>108</b> immediately or go to the nearest hospital.';
  return null;
}

function aiDisclaimerHTML(){
  const H=lang==='hi';
  return `<div class="t-xs muted mt8" style="border-top:1px solid var(--line);padding-top:8px">
    ${H?'यह सामान्य जानकारी है, चिकित्सीय सलाह/प्रिस्क्रिप्शन नहीं। सही जांच के लिए डॉक्टर से मिलें।':'General information only, not a diagnosis or prescription. Please consult a doctor for proper care.'}
    <button class="qbtn mt8" onclick="startCase()"> ${t('newCase')}</button>
  </div>`;
}

async function sendAI(){
  if(aiBusy)return;
  const i=document.getElementById('ai');const m=(i.value||'').trim();if(!m)return;
  const c=document.getElementById('chat');
  c.innerHTML+=`<div class="bub me">${esc(m)}</div>`;i.value='';c.scrollTop=c.scrollHeight;
  aiHistory.push({role:'user',text:m});

  const emg=emergencyCheck(m.toLowerCase());
  if(emg){
    c.innerHTML+=`<div class="bub ai warn">${emg}<br><a href="tel:108" class="btn btn-red btn-sm mt8" style="display:inline-flex"> 108</a></div>`;
    c.scrollTop=c.scrollHeight;return;
  }

  aiBusy=true;
  const typingId='typing-'+Date.now();
  c.innerHTML+=`<div class="bub ai" id="${typingId}"> ${lang==='hi'?'लिख रहा है...':'Typing...'}</div>`;
  c.scrollTop=c.scrollHeight;

  const {data,errDetail}=await aiFetch(API_URL+'/api/ai',{prompt:m,language:lang==='hi'?'Hindi':'English'},60000);
  aiBusy=false;
  const bub=document.getElementById(typingId);
  if(!bub)return; // user navigated away

  // Backend shape: {success:true, reply:"..."} on success, {success:false, fallback:true, message/error} on failure
  let reply=data&&data.success&&data.reply?data.reply:null;
  let bodyHTML;
  if(reply){
    aiHistory.push({role:'ai',text:reply});
    bodyHTML=esc(reply).replace(/\n/g,'<br>');
  }else{
    const serverMsg=data&&(data.message||data.error);
    bodyHTML=(lang==='hi'?' अभी जवाब नहीं मिल पाया। कृपया दोबारा कोशिश करें या डॉक्टर से सलाह लें।':' Could not get a response right now. Please try again or consult a doctor.')
      +(errDetail||serverMsg?`<br><span class="t-xs muted">(debug: ${esc(errDetail||serverMsg)})</span>`:'');
  }
  bub.outerHTML=`<div class="bub ai">${bodyHTML}
    <div class="row gap8 mt8"><button class="qbtn" onclick="speak(this.closest('.bub').innerText)"> ${t('listen')}</button></div>
    ${aiDisclaimerHTML()}
  </div>`;
  c.scrollTop=c.scrollHeight;
}

/* Like safeFetch, but surfaces WHY a call failed (status code / network error / bad JSON)
   so integration issues can be diagnosed instead of hidden behind a generic message. */
async function aiFetch(url,body,timeoutMs){
  if(!API_URL)return{data:null,errDetail:'API_URL not set'};
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
    let res;
    try{
      res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});
    }finally{clearTimeout(timer);}
    if(!res.ok){
      let bodyText='';try{bodyText=(await res.text()).slice(0,120);}catch(e){}
      return{data:null,errDetail:`HTTP ${res.status}${bodyText?': '+bodyText:''}`};
    }
    const data=await res.json().catch(()=>null);
    if(data===null)return{data:null,errDetail:'response was not valid JSON'};
    return{data,errDetail:null};
  }catch(e){
    const detail=e.name==='AbortError'?`timed out after ${Math.round(timeoutMs/1000)}s (Render may be cold-starting)`:e.message;
    return{data:null,errDetail:detail};
  }
}

    if(statsEl){
      statsEl.innerHTML=`
        <div class="tile"><span class="ic"></span><span class="tx">Pending<br><b style="font-size:19px;color:#047857">${pend}</b></span></div>
        <div class="tile"><span class="ic"></span><span class="tx">Urgent<br><b style="font-size:19px;color:#dc2626">${urgent}</b></span></div>
        <div class="tile"><span class="ic"></span><span class="tx">Reviewed<br><b style="font-size:19px;color:#047857">${done}</b></span></div>
        <div class="tile"><span class="ic"></span><span class="tx">Mode<br><b style="font-size:14px;color:#f59e0b">Offline</b></span></div>`;
    }
    if(forceNetwork)toast(' Server slow/offline. Showing local data.','warn');
  }
  reps=(reps||[]).map(r=>({...r,patientPhone:normPhone(r.patientPhone),status:r.status||'pending'}));
  if(!reps.length){
    el.innerHTML=`<div class="card tc"><div style="font-size:56px"></div><div class="muted mt8">No reports</div><button class="btn btn-o mt12" onclick="loadInbox(true)"> Refresh</button></div>`;
    return;
  }
  el.innerHTML=reps.map(r=>docCard(r)).join('');
}

function docCard(r){
  const sv=(r.severity||'').toLowerCase();
  const cls=sv.includes('sever')||sv.includes('गंभीर')?'pill-r':sv.includes('mod')||sv.includes('मध्यम')?'pill-y':'pill-g';
  const rid=String(r.reportId||'').replace(/'/g,'');
  const rev=r.status==='reviewed';
  const safeR=encodeURIComponent(JSON.stringify(r));
  return `<div class="rep-card ${cls==='pill-r'?'sev':''} ${rev?'reviewed':''}" id="card-${rid}">
    <div class="between mb8">
      <span class="t-xs muted"> ${new Date(r.createdAt||Date.now()).toLocaleString()}</span>
      <div>${rev?'<span class="pill pill-b"> Reviewed</span> ':''}<span class="pill ${cls}">${esc(r.severity||'-')}</span></div>
    </div>
    ${r.redFlag==='YES'?`<div class="alert alert-red mb8"> <b>RED FLAG</b></div>`:''}
    <div class="bold t-lg">${esc(r.patientName||'Patient')} <span class="t-sm muted">• ${esc(r.patientAge||'-')}y ${esc(r.patientGender||'')} • ${esc(r.patientPhone||'')}</span></div>
    <div class="bold green t-lg mt8"> ${esc(r.mainComplaint||'-')}</div>
    <div class="rv"><span class="k">Location</span><span class="v">${esc(r.location||'-')}</span></div>
    <div class="rv"><span class="k">Duration</span><span class="v">${esc(r.duration||'-')}</span></div>
    <div class="rv"><span class="k">Details</span><span class="v">${esc(r.problemDetails||'-')}</span></div>
    <div class="rv"><span class="k">Worse by</span><span class="v">${esc(r.worseBy||'-')}</span></div>
    <div class="rv"><span class="k">Better by</span><span class="v">${esc(r.betterBy||'-')}</span></div>
    <div class="rv"><span class="k">Other sym</span><span class="v">${esc(r.otherSymptoms||'-')}</span></div>
    <div class="rv"><span class="k">Conditions</span><span class="v">${esc(r.existingConditions||'-')}</span></div>
    <div class="rv"><span class="k">Allergies</span><span class="v" style="color:#dc2626">${esc(r.allergies||'-')}</span></div>
    <div class="rv"><span class="k">Medicines</span><span class="v">${esc(r.currentMedicines||'-')}</span></div>
    <div class="rv"><span class="k">Sleep</span><span class="v">${esc(r.sleep||'-')}</span></div>
    <div class="rv"><span class="k">Stress</span><span class="v">${esc(r.stress||'-')}</span></div>
    <div class="rv"><span class="k">Notes</span><span class="v">${esc(r.extraNotes||'-')}</span></div>
    <div class="t-xs muted mt8"> ${esc(r.reportId||'-')}</div>
    <div id="review-box-${rid}">
      ${rev?`
        <div class="alert alert-blue mt12"> <div>
          <b>Reviewed by ${esc(r.reviewedBy||'Doctor')}</b><br>
          ${r.reviewedAt?new Date(r.reviewedAt).toLocaleString():''}
          ${r.doctorNotes?'<br><b>Notes:</b> '+esc(r.doctorNotes):''}
          ${r.doctorPrescription?'<br><b>Rx:</b> '+esc(r.doctorPrescription):''}
        </div></div>
        <div class="action-btns">
          <button class="btn btn-o btn-sm" onclick="openEditReview('${rid}')"> Edit Review</button>
          <button class="btn btn-saf btn-sm" onclick="unmarkReview('${rid}')">↩ Unmark</button>
        </div>
        <button class="btn btn-sm mt8" style="width:100%" onclick="viewRepFromEncoded('${safeR}')"> View / PDF</button>
      `:`
        <textarea id="dn-${rid}" class="inp mt12" placeholder="Clinical notes / Diagnosis / Prakriti..."></textarea>
        <textarea id="dp-${rid}" class="inp mt8" placeholder="Prescription (Rx)..."></textarea>
        <div class="action-btns">
          <button class="btn btn-sm" onclick="markReviewed('${rid}')"> Mark Reviewed</button>
          <button class="btn btn-o btn-sm" onclick="viewRepFromEncoded('${safeR}')"> PDF</button>
        </div>
      `}
    </div>
  </div>`;
}

async function markReviewed(rid){
  const notes=(document.getElementById('dn-'+rid)?.value||'').trim();
  const rx=(document.getElementById('dp-'+rid)?.value||'').trim();
  load(1);
  let inbox=getInbox();
  let rep=inbox.find(r=>r.reportId===rid)||{reportId:rid};
  const updated={...rep,status:'reviewed',doctorNotes:notes,doctorPrescription:rx,reviewedAt:new Date().toISOString(),reviewedBy:currentDoctor?currentDoctor.name:'Doctor'};
  upsertLocalReport(updated);
  const apiRes=await safeFetch(API_URL+'/api/doctor/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reportId:rid,doctorNotes:notes,doctorPrescription:rx,reviewedBy:currentDoctor?currentDoctor.name:'Doctor'})},60000);
  load(0);
  if(apiRes&&apiRes.success)toast(' Reviewed & synced','ok');
  else toast(' Reviewed locally (server sync pending)','warn');
  loadInbox(true);
}

function openEditReview(rid){
  const inbox=getInbox();
  let rep=inbox.find(r=>r.reportId===rid)||{reportId:rid,doctorNotes:'',doctorPrescription:''};
  const box=document.getElementById('review-box-'+rid);
  if(!box){toast(' Cannot open editor','err');return;}
  box.innerHTML=`
    <div class="alert alert-warn mt12"> <div><b>Editing Review</b></div></div>
    <textarea id="edit-n-${rid}" class="inp mt8" placeholder="Clinical notes">${esc(rep.doctorNotes||'')}</textarea>
    <textarea id="edit-p-${rid}" class="inp mt8" placeholder="Prescription">${esc(rep.doctorPrescription||'')}</textarea>
    <div class="action-btns">
      <button class="btn btn-sm" onclick="saveEditReview('${rid}')"> Save Changes</button>
      <button class="btn btn-gray btn-sm" onclick="loadInbox(true)">Cancel</button>
    </div>`;
}

async function saveEditReview(rid){
  const notes=(document.getElementById('edit-n-'+rid)?.value||'').trim();
  const rx=(document.getElementById('edit-p-'+rid)?.value||'').trim();
  load(1);
  const inbox=getInbox();
  const old=inbox.find(r=>r.reportId===rid)||{reportId:rid};
  const updated={...old,status:'reviewed',doctorNotes:notes,doctorPrescription:rx,reviewedAt:new Date().toISOString(),reviewedBy:currentDoctor?currentDoctor.name:'Doctor'};
  upsertLocalReport(updated);
  const apiRes=await safeFetch(API_URL+'/api/doctor/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reportId:rid,doctorNotes:notes,doctorPrescription:rx,reviewedBy:currentDoctor?currentDoctor.name:'Doctor'})},60000);
  load(0);
  if(apiRes&&apiRes.success)toast(' Review updated','ok');
  else toast(' Updated locally (server pending)','warn');
  loadInbox(true);
}

async function unmarkReview(rid){
  if(!confirm('Move this report back to New?'))return;
  load(1);
  const inbox=getInbox();
  const old=inbox.find(r=>r.reportId===rid)||{reportId:rid};
  const updated={...old,status:'pending',reviewedAt:null};
  upsertLocalReport(updated);
  const apiRes=await safeFetch(API_URL+'/api/doctor/unmark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reportId:rid})},60000);
  load(0);
  if(apiRes&&apiRes.success)toast('↩ Moved to New','ok');
  else toast('↩ Local unmark done (server pending)','warn');
  loadInbox(true);
}

async function docSearch(){
  const ph=normPhone(document.getElementById('ds').value);
  if(ph.length!==10){toast(' 10-digit','err');return;}
  const el=document.getElementById('dr');
  el.innerHTML=`<div class="card tc muted"> Searching...</div>`;
  const d=await safeFetch(API_URL+'/api/search?phone='+ph,{},60000);
  let patient=null;let reports=[];
  if(d&&d.patient){patient=d.patient;reports=d.reports||[];}
  else{const inbox=getInbox();reports=inbox.filter(r=>normPhone(r.patientPhone)===ph);
    if(reports.length)patient={name:reports[0].patientName,age:reports[0].patientAge,gender:reports[0].patientGender,phone:ph};}
  if(!patient){el.innerHTML=`<div class="card tc"><div style="font-size:52px"></div><div class="muted mt8">Not found</div></div>`;return;}
  el.innerHTML=`<div class="card-hero mb16">
    <div class="t-sm" style="opacity:.9">Patient</div>
    <div class="t-xl bold">${esc(patient.name)}</div>
    <div class="t-sm mt8">${esc(patient.age)}y • ${esc(patient.gender)} • ${esc(patient.phone)}</div>
  </div>
  <div class="t-lg bold green mb12"> Reports (${reports.length})</div>
  ${reports.length?reports.map(r=>docCard(r)).join(''):`<div class="card tc muted">No reports</div>`}`;
}

/* ═══════════ BOOT ═══════════ */
try{
  if(currentDoctor)go(PageDoc);
  else if(me&&me.name&&me.phone)go(PageHome);
  else go(PageLang);
}catch(e){console.error(e);localStorage.clear();go(PageLang);}
</script>
